name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check code, types, and tests
        run: make check
      - name: Build wheel and source archive
        run: python -m build
      - name: Install built wheel without dependencies
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed module entry point
        run: python -m densetopo_unet --help
