name: Feature request
description: Propose a scoped interface, method, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or engineering problem
      description: State the current limitation without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, validation, and compatibility.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Explain supporting evidence, alternatives, and evaluation needed.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal preserves deployment without original reference data.
          required: true
        - label: The proposal does not depend on committing research data or trained weights.
          required: true
