# Small CPU-only configuration generated by scripts/generate_synthetic_data.py.
volume:
  shape: [8, 16, 16]
  dtype: float32
  byte_order: little
  axis_order: zyx
  value_domain: signed

compression:
  absolute_error_bound: 0.02

topology:
  persistence_threshold: 0.06
  match_radius: 0
  neighborhood: cube26

normalization:
  mode: max_abs
  epsilon: 1.0e-12

model:
  patch_size: [8, 16, 16]
  base_channels: 2
  correction_scale: 0.75

training:
  epochs: 2
  batch_size: 1
  validation_batch_size: 1
  samples_per_epoch: 2
  validation_samples: 2
  num_workers: 0
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  minimum_epochs: 1
  early_stopping_patience: 2
  topology_warmup_start: 0
  topology_warmup_end: 1
  mixed_precision: false
  seed: 2026
  device: cpu
